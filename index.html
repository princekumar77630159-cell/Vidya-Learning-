<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon Configuration -->
    <!-- यह आइकन ब्राउज़र टैब और बुकमार्क में दिखाई देगा। इसे अपने विद्या लर्निंग लोगो से बदलें। -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Viewport & Mobile Optimization -->
    <!-- यह सुनिश्चित करता है कि वेबसाइट मोबाइल उपकरणों पर सही ढंग से स्केल और रेंडर हो, जो एक शिक्षा ऐप के लिए आवश्यक है जहाँ अधिकांश छात्र मोबाइल का उपयोग करते हैं। -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#131722" />
    
    <!-- SEO & Metadata -->
    <title>Vidya Learning | Smart & Free Education</title>
    <meta name="description" content="विद्या लर्निंग के साथ भारत के सर्वश्रेष्ठ शिक्षकों से प्रीमियम कोर्सेज प्राप्त करें - वो भी बिना किसी शुल्क के। एक ही जगह पर सब कुछ।" />
    <meta name="keywords" content="Education, Free Courses, Online Learning, Vidya Learning, Class 10" />
    <meta name="author" content="Vidya Learning" />
    
    <!-- Open Graph (Social Media Sharing) -->
    <!-- जब कोई आपकी वेबसाइट का लिंक WhatsApp या Telegram पर शेयर करेगा, तो ये टैग एक सुंदर कार्ड প্রিভিউ (preview) बनाने में मदद करेंगे। -->
    <meta property="og:title" content="Vidya Learning | Smart & Free Education" />
    <meta property="og:description" content="मुफ्त प्रीमियम कोर्सेज के साथ अपनी पढ़ाई को स्मार्ट बनाएं।" />
    <meta property="og:type" content="website" />
    
    <!-- Preconnect to external domains (Optional for performance) -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
  </head>
  <body class="bg-black antialiased">
    <!-- NoScript Fallback -->
    <noscript>
      <div style="padding: 20px; text-align: center; color: white; background-color: #131722; height: 100vh;">
        <h3>विद्या लर्निंग (Vidya Learning) चलाने के लिए आपके ब्राउज़र में JavaScript सक्षम होना आवश्यक है।</h3>
        <p>कृपया अपनी ब्राउज़र सेटिंग्स में JavaScript चालू करें और पुनः प्रयास करें।</p>
      </div>
    </noscript>
    
    <!-- Root Container for React App -->
    <div id="root"></div>
    
    <!-- Main React Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
